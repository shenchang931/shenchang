<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            display: flex;
            flex-wrap: wrap;
            margin: 10px;
        }
        .box{
            width: 150px;
            height: 150px;
            border: 1px solid #ccc;
            margin: 10px;
            display: flex;
            align-items: center;
            /* 水平垂直居中 */
            justify-content: center;
            align-items: center;
            font-size: 40px;
            transition: all 0.6s;
            box-sizing: border-box;
            /* width :包含padding和bording */
        }
        .box:first-child:hover{
            background: red;
            color: white;
            font-size: 140px;
        }
        .box:nth-child(2):hover{
            border-radius: 50%;
            border-width: 10px;
        }
        .box:nth-child(3):hover{
            box-shadow: 10px 10px 10px #ccc;
        }.box:nth-of-type(4):hover{
            text-shadow: 10px 10px 10px red ;
        }
        .box:nth-of-type(5):hover{
            /* 线性渐变 */
            background: linear-gradient(to right, #000,#ccc,#fff );
        }
        .box.box:nth-of-type(5)+.box{
            /* 径向渐变 */
            background: radial-gradient(#fff,#ccc,#000);
        }
        /* 相邻兄弟选择器
         +后面的一个兄弟
         ~后面的所有兄弟
          */
          .box.box:nth-of-type(7):hover{
            transform: scale(0.5);
          }
          .box.box:nth-of-type(8):hover{
            transform: translate(-150px);
          }
          .box.box:nth-of-type(9):hover{
            transform: rotateX(-180deg);
          }
          .box.box:nth-of-type(10):hover{
            transform: skewX(20deg) translateY(50px);
          }
          .box:nth-last-child(2):hover::before{
            /* 内部的最前面的元素 */
            content: "*";
            color: red;
          }
          /* 扩展，第12个盒子，鼠标在上面时沈畅，要求名字深色背景白色文字，水平垂直居中 */
        .box:last-child{
            /* 为 ::after 提供定位基准 */
            position: relative;
        }
        .box:last-child:hover{
            /* 深色背景 */
            background-color: #1a1a2e;
            /* 原数字隐藏，让"沈畅"独占显示 */
            color: transparent;
        }
        .box:last-child:hover::after{
            content: "沈畅";
            /* 水平垂直居中 */
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 深色背景，白色文字 */
            background-color: #1a1a2e;
            color: #ffffff;
            font-size: 36px;
            letter-spacing: 8px;
        }
           
    
         
          .box:nth-child(3n):hover{
            border: 3px solid red;
          }
          /* 偶数：even，奇数：odd */
          /* 扩展2：鼠标在偶数盒子上时，自定义效果 */
        
          .box:nth-child(even):hover{
            background-color: #7c3aed;
            color: #ffffff;
          }


            
    </style>
    </style>
</head>
<body>
    <div class="main">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        <div class="box">9</div>
        <div class="box">10</div>
        <div class="box">11</div>
        <div class="box">12</div>
    </div>
</body>
</html>
