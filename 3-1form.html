<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>931沈畅</title>
</head>
<body>
    <h2>表单</h2>
    <form action="http://huanqiu.com" name ="y1" >  

        <p>用户名：<input type="text" name="username"placeholder="请输入用户名"></p>
        <p>密码：<input type="password" name="password"placeholder="请输入密码"></p>
        <p>性别：
            <input type="radio" name="sex" value="make">男
            <input type="radio" name="sex" value="female">女
            <input type="radio" name="sex" value="secret">保密
       </p>
       <p>爱好：
           <input type="checkbox" name="hobby" value="basketball">篮球
           <input type="checkbox" name="hobby" value="football">足球
           <input type="checkbox" name="hobby" value="table-tennis">乒乓球
           <input type="checkbox" name="hobby"  value="badminton">羽毛球
       </p>
       <p>籍贯：
           <select name="birthplace">
               <option value="beijing">北京</option>
               <option value="shanghai">上海</option>
               <option value="guangzhou">广州</option>
               <option value="shenzhen">深圳</option>
           </select>
       </p>
       <p>个人介绍：
            <textarea name="introduction" cols="30" rows="10" placeholder="请输入个人介绍"></textarea>

       </p>
       <p>出生日期：
           <input type="date" name="birthday">

       </p>
       <p>上传文件：
           <input type="file" name="files" multiple>
       </p>
      <p>
        <input type="submit" value="提交按钮">
        <input type="button" value="普通按钮">
        <input type="reset"  value="重置按钮">
      </p>

    </form>
    <button>按钮</button>
</body>
</html>
