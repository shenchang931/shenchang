<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>沈畅:JavaScript</h2>
    <script>

        //输出：沈畅，你好，document.alert.console三种方式
        document.write("沈畅，你好");
        alert("沈畅，你好");
        console.log("沈畅，你好");
        //confirm和prompt两种方式输入
        confirm("沈畅，你好");
        prompt("沈畅，你好");
    </script>
</body>
</html>
