<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex 布局演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 28px;
        }

        .wrap {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
        }

        .wrap li {
            width: 22%;
            min-width: 200px;
            height: 300px;
            border: 1px solid #333;
            list-style: none;
            display: flex;
            padding: 10px;
        }

        .box {
            width: 70px;
            height: 70px;
            background-color: #F2F3F4;
            border: 1px solid #999;
        }

        /* 1. 单项目水平垂直居中 */
        .wrap li:nth-child(1) {
            align-items: center;
            justify-content: center;
        }

        /* 2. 两个项目垂直排列并居中 */
        .wrap li:nth-child(2) {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* 3. 四个项目 2x2 排列 */
        .wrap li:nth-child(3) {
            flex-wrap: wrap;
            justify-content: space-around;
            align-content: space-around;
        }

        .wrap li:nth-child(3) .box {
            width: 40%;
            height: 40%;
        }

        /* 4. 上宽下窄，底部两个并排 */
        .wrap li:nth-child(4) {
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
        }

        .wrap li:nth-child(4) .top {
            width: 100%;
            height: 40%;
            background-color: #F2F3F4;
            border: 1px solid #999;
        }

        .wrap li:nth-child(4) .bottom-wrap {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            height: 55%;
        }

        .wrap li:nth-child(4) .bottom-wrap .box {
            flex: 1;
            height: 100%;
            width: auto;
        }
    </style>
</head>
<body>
    <h2>沈畅的flex</h2>
    <ul class="wrap">
        <li>
            <div class="box"></div>
        </li>
        <li>
            <div class="box"></div>
            <div class="box"></div>
        </li>
        <li>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </li>
        <li>
            <div class="top"></div>
            <div class="bottom-wrap">
                <div class="box"></div>
                <div class="box"></div>
            </div>
        </li>
    </ul>
</body>
</html>
