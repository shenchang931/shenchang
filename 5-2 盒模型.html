<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒模型、框模型、box model</title>
    <style>
        body,u1,p,h1,h2,h3,h4,h5,h6{
            margin: 0;
            padding: 0;
        }
        u1{
            list-style: none;
        }
        .a{
            width: 500px;
            height: 300px;
            border: 2px dotted #039;
            padding: 70px 60px 50px 40px;  /*上、下、左、右 */
            margin: 40px auto;
            /* 上下，左右，左右margin为auto则盒子居中 */
        }
        .b{ 
            width: 500px;
            height: 300px;
            border: 2px dashed #039;
             margin: 50px auto 40px;
             /* 上、左右、下 */
        }
        .c{
            width: 500px;
            height: 300px;
            border: 2px solid #039;
             margin: 50px auto 40px;
        }
    </style>
</head>
<body>
    <div class="a">931沈畅</div>
    <div class="b">931沈畅</div>
    <div class="c">931沈畅</div>
</body>
</html>
