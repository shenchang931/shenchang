<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>10-2 CSS Animation 幻灯片</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }

    .card {
      width: 820px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 20px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
      padding: 26px;
    }

    .slider {
      position: relative;
      width: 100%;
      height: 420px;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
    }

    .slide {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0;
      animation: slideCycle 12s infinite;
    }

    .slide:nth-child(1) { animation-delay: 0s; }
    .slide:nth-child(2) { animation-delay: 4s; }
    .slide:nth-child(3) { animation-delay: 8s; }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slide .text {
      position: absolute;
      left: 30px;
      bottom: 28px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 28px;
      letter-spacing: 2px;
      backdrop-filter: blur(2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    }

    .info {
      text-align: center;
      margin-top: 18px;
      font-size: 26px;
      color: #0f172a;
      letter-spacing: 4px;
      font-weight: 700;
    }

    @keyframes slideCycle {
      0%, 25% {
        transform: translateX(0%);
        opacity: 1;
        z-index: 2;
      }
      33%, 100% {
        transform: translateX(-100%);
        opacity: 0;
        z-index: 1;
      }
    }

    .slide:nth-child(2) {
      animation-name: slideCycle2;
    }

    .slide:nth-child(3) {
      animation-name: slideCycle3;
    }

    @keyframes slideCycle2 {
      0%, 25% {
        transform: translateX(100%);
        opacity: 0;
        z-index: 1;
      }
      33%, 58% {
        transform: translateX(0%);
        opacity: 1;
        z-index: 2;
      }
      66%, 100% {
        transform: translateX(-100%);
        opacity: 0;
        z-index: 1;
      }
    }

    @keyframes slideCycle3 {
      0%, 58% {
        transform: translateX(100%);
        opacity: 0;
        z-index: 1;
      }
      66%, 91% {
        transform: translateX(0%);
        opacity: 1;
        z-index: 2;
      }
      100% {
        transform: translateX(-100%);
        opacity: 0;
        z-index: 1;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="slider" aria-label="图片轮播">
      <div class="slide">
        <img src="img/1.jpg" alt="图片1" />
        <div class="text">沈畅</div>
      </div>
      <div class="slide">
        <img src="img/3.jpg" alt="图片2" />
        <div class="text">沈畅</div>
      </div>
      <div class="slide">
        <img src="img/2.jpg" alt="图片3" />
        <div class="text">沈畅</div>
      </div>
    </div>

    
  </div>
</body>
</html>
