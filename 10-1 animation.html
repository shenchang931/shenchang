<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSS animation 背景颜色循环变化</title>
<style>
    body{
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        font-family: "Microsoft YaHei", sans-serif;
    }

    /* 单一盒子，4 种颜色循环 */
    .box{
        width: 240px;
        height: 240px;
        border-radius: 20px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 4px;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);

        /* 纯 CSS animation */
        animation: changeColor 8s linear infinite;
    }

    /* 4 个关键帧节点 = 4 种颜色 */
    @keyframes changeColor{
        0%   { background-color: #ef4444; }   /* 红 */
        25%  { background-color: #f59e0b; }   /* 橙 */
        50%  { background-color: #10b981; }   /* 绿 */
        75%  { background-color: #3b82f6; }   /* 蓝 */
        100% { background-color: #ef4444; }   /* 回到红 */
    }
</style>
</head>
<body>
    <div class="box">沈畅</div>
</body>
</html>
